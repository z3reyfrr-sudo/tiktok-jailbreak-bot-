name: pulse

on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 UTC — off the top-of-hour rush
  workflow_dispatch:
    inputs:
      video:
        description: "Comma-separated video URLs (optional)"
        required: false
      views:
        description: "Watch seconds per video"
        required: false
        default: "6"

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger one worker pass
        run: |
          URL="${{ secrets.BOT_URL }}/pulse"
          Q="token=${{ secrets.PULSE_TOKEN }}"
          if [ -n "${{ github.event.inputs.video }}" ]; then
            Q="$Q&video=${{ github.event.inputs.video }}"
          fi
          if [ -n "${{ github.event.inputs.views }}" ]; then
            Q="$Q&views=${{ github.event.inputs.views }}"
          fi
          echo "POST $URL"
          curl -sS -m 60 -X POST "$URL?$Q" | tee response.json
          grep -q '"started":true' response.json || { echo "pulse rejected"; exit 1; }
